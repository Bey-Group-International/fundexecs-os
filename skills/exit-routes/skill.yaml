# skills/exit-routes/skill.yaml
# Authoring spec for Exit Strategy & Route Comparison. The machine-readable manifest the runtime loads is
# the TypeScript SkillDefinition in lib/skills/catalog/exit-routes.ts; this YAML is the
# human-facing contract and must stay consistent with it.
# Origin: PE department pack · Exit + IPO. Rules re-implemented natively; no pack text is shipped.
id: exit-routes
name: Exit Strategy & Route Comparison
version: 1.0.0
owner: fundexecs
hub: execute

applicable_executives:
  - analyst
  - investment_committee

supported_entity_types: [asset, company]

required_inputs:
  - company
  - equityInvested
  - ownershipPct
  - netDebtAtExit
  - yearsHeld
  - routes

optional_inputs:
  - fundLifeRemainingMonths
  - hurdles
  - gateOwner

outputs:
  - routes
  - primary
  - fallback
  - orderingRule
  - gate

artifact_types: [analysis]
data_permissions: [asset:read, valuation:read]
tools: []

approval_tier: 1
risk_classification: moderate
execution_timeout_ms: 10000
retry_policy:
  max_attempts: 1
  backoff_ms: 0

provider_capabilities:
  - financial_reasoning

allowed_downstream_skills: [exit-readiness, buyer-list, final-investment-report]

prohibited_actions:
  - send_outreach
  - distribute_report
  - share_materials
  - sign_document
  - move_capital

input_schema: input.schema.json
output_schema: output.schema.json
policy: policy.yaml
evaluation: evaluation.yaml
