# skills/first-look/skill.yaml
# Authoring spec for First Look Screen. The machine-readable manifest the runtime loads is
# the TypeScript SkillDefinition in lib/skills/catalog/first-look.ts; this YAML is the
# human-facing contract and must stay consistent with it.
# Origin: PE department pack · Deal Sourcing. Rules re-implemented natively; no pack text is shipped.
id: first-look
name: First Look Screen
version: 1.0.0
owner: fundexecs
hub: source

applicable_executives:
  - deal_sourcer
  - analyst
  - investment_committee

supported_entity_types: [deal, company]

required_inputs:
  - mandate
  - deal.name

optional_inputs:
  - deal.reportedEbitda
  - deal.adjustments
  - deal.statedAdjustedEbitda
  - deal.sourceRefs
  - gateOwner

outputs:
  - view
  - reason
  - ebitdaBridge
  - threeReasonsItCouldFail
  - threeFactsThatWouldKillIt
  - gate

artifact_types: [analysis]
data_permissions: [deal:read, mandate:read]
tools: []

approval_tier: 1
risk_classification: low
execution_timeout_ms: 15000
retry_policy:
  max_attempts: 1
  backoff_ms: 0

provider_capabilities:
  - structured_extraction
  - financial_reasoning

allowed_downstream_skills: [screen-deal, returns, dd-checklist, ic-memo]

prohibited_actions:
  - send_outreach
  - distribute_report
  - sign_document
  - move_capital
  - capital_call

input_schema: input.schema.json
output_schema: output.schema.json
policy: policy.yaml
evaluation: evaluation.yaml
