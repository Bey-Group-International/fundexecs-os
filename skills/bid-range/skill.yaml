# skills/bid-range/skill.yaml
# Authoring spec for Bid Price Range. The machine-readable manifest the runtime loads is
# the TypeScript SkillDefinition in lib/skills/catalog/bid-range.ts; this YAML is the
# human-facing contract and must stay consistent with it.
# Origin: PE department pack · Diligence + Valuation. Rules re-implemented natively; no pack text is shipped.
id: bid-range
name: Bid Price Range
version: 1.0.0
owner: fundexecs
hub: run

applicable_executives:
  - analyst
  - investment_committee

supported_entity_types: [deal]

required_inputs:
  - ebitda

optional_inputs:
  - leverageMultiple
  - debtAmount
  - holdYears
  - exitMultiple
  - ebitdaGrowthRate
  - hurdles
  - downsideCase
  - compsMultipleRange
  - redFlagPriceAdjustment
  - openingDiscountPct
  - targetDiscountPct
  - gateOwner

outputs:
  - base
  - downside
  - walkAway
  - target
  - opening
  - versusComps
  - note
  - gate

artifact_types: [analysis]
data_permissions: [deal:read, valuation:read]
tools: []

approval_tier: 1
risk_classification: moderate
execution_timeout_ms: 15000
retry_policy:
  max_attempts: 1
  backoff_ms: 0

provider_capabilities:
  - financial_reasoning

allowed_downstream_skills: [ic-memo, returns]

prohibited_actions:
  - send_outreach
  - distribute_report
  - sign_document
  - move_capital
  - capital_call
  - submit_term_sheet

input_schema: input.schema.json
output_schema: output.schema.json
policy: policy.yaml
evaluation: evaluation.yaml
