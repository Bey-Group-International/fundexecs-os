# skills/target-screen/skill.yaml
# Authoring spec for Target Screening. The machine-readable manifest the runtime loads is
# the TypeScript SkillDefinition in lib/skills/catalog/target-screen.ts; this YAML is the
# human-facing contract and must stay consistent with it.
# Origin: PE department pack · Deal Sourcing. Rules re-implemented natively; no pack text is shipped.
id: target-screen
name: Target Screening
version: 1.0.0
owner: fundexecs
hub: source

applicable_executives:
  - deal_sourcer
  - analyst

supported_entity_types: [company, mandate]

required_inputs:
  - mandate
  - targets

optional_inputs:
  - gateOwner

outputs:
  - results
  - counts
  - basis
  - limitation
  - gate

artifact_types: [analysis]
data_permissions: [company:read, mandate:read]
tools: []

approval_tier: 1
risk_classification: low
execution_timeout_ms: 15000
retry_policy:
  max_attempts: 1
  backoff_ms: 0

provider_capabilities:
  - structured_extraction

allowed_downstream_skills: [first-look, screen-deal, dd-checklist]

prohibited_actions:
  - send_outreach
  - distribute_report
  - sign_document
  - move_capital
  - capital_call

input_schema: input.schema.json
output_schema: output.schema.json
policy: policy.yaml
evaluation: evaluation.yaml
