# Apply database migrations to the PRODUCTION Supabase project on merge to main.
#
# Why this exists: preview branches (per-PR) always got their migrations, but the
# production database fell ~11 migrations behind because nothing applied repo
# migrations to prod on merge. This workflow closes that gap: every push to main
# that touches supabase/migrations/** runs `supabase db push` against production,
# so the live schema always matches the merged code.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — a Supabase personal access token (account → tokens)
#   SUPABASE_PROJECT_REF   — the production project ref: qhxcvvidhnwdgemjeaug
#   SUPABASE_DB_PASSWORD   — the production database password
#
# A failure here is easy to miss, and that has already cost a month: the
# SUPABASE_ACCESS_TOKEN expired on 2026-07-19 and every run since died at
# `supabase link` with {"message":"Unauthorized"}. Nothing blocks a merge on a
# red DB Migrate run, so migrations quietly stopped reaching production while
# the merges kept looking green. The steps below exist to make that state
# loud: the link step names the credential when it fails, and the drift check
# afterwards compares the repository against the remote history IN BOTH
# DIRECTIONS, naming the exact versions involved -- migrations that did not
# apply, versions recorded with no file here, and migrations this push added
# that production had already recorded (which means they were applied out of
# band and `db push` skipped the committed file).
#
# The one legal path for a schema change, and how to recover when one has
# already been applied by hand, are in supabase/migrations/README.md.
#
# `supabase db push --include-all` applies every local migration whose version is
# not already in the remote history — including files whose timestamps sort before
# the remote head, which happens routinely when parallel sessions merge migrations
# out of timestamp order (without the flag the CLI refuses and the run goes red).
# It never re-applies recorded versions, so reruns are idempotent. Note the flag
# bypasses timestamp-ordering only, not dependency ordering: an out-of-order file
# still runs after later-stamped ones already applied, so migrations must remain
# dependency-safe (IF NOT EXISTS-style guards), per this repo's convention.
name: DB Migrate

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

permissions:
  contents: read

# Never let two production migration pushes run at once.
concurrency:
  group: db-migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Enough history to see which migrations THIS push added, which is
          # what the out-of-band check below compares against the pre-push
          # remote history. A squash merge is one commit, so 50 is generous;
          # `fetch-depth: 0` would clone 220MB of history to read one diff.
          fetch-depth: 50
          # Keep this job's token out of .git/config. checkout persists it there
          # by default, where every later step can read it (zizmor: artipacked).
          # Nothing here pushes, so it is dead weight with a blast radius.
          persist-credentials: false

      # Pinned, not `latest`, and the reason is the token rather than taste.
      #
      # The PAT this workflow carries only needs to READ the project: `link`
      # fetches project status over the Management API, while `db push` and
      # `migration list` reach the database directly with SUPABASE_DB_PASSWORD.
      # That is what makes a read-only, project-scoped token sufficient. But
      # WHICH endpoints `link` calls is the CLI's choice, so on `latest` a new
      # release could start requiring a scope the token does not carry — and the
      # first sign would be a red DB Migrate run on a merge that nobody is
      # watching, which is exactly how this workflow went unnoticed for a month
      # when the token expired, and again on 2026-09-30.
      #
      # 2.118.0 is INFERRED, not verified, and the distinction matters here of
      # all places. Run 36731231062 applied 20260930083000 through 20260930110000
      # successfully, but its log records `version: latest` and never prints what
      # that resolved to — so it is evidence that SOME version worked, not that
      # this one did. 2.118.0 is what the release history says was current on
      # 2026-09-30 (published 2026-09-25).
      #
      # Which is the argument for pinning rather than against it: if the inference
      # is wrong, the next run says so out loud instead of the version continuing
      # to drift unobserved. Moving it is then a deliberate change with a run to
      # prove it, not something that happens on its own.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.118.0

      - name: Link production project
        run: |
          if ! supabase link --project-ref "$SUPABASE_PROJECT_REF"; then
            echo "::error title=Supabase link failed::Could not link the production project."
            echo "::error::An 'Unauthorized' here means SUPABASE_ACCESS_TOKEN is expired or revoked."
            echo "::error::Mint a new personal access token (Supabase dashboard -> account -> tokens)"
            echo "::error::and update the SUPABASE_ACCESS_TOKEN repository secret. Until then NO"
            echo "::error::migration reaches production, and merges will keep looking green."
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Read the remote history BEFORE pushing, because afterwards it is too
      # late to tell the two cases apart.
      #
      # After `db push` runs, a version being recorded remotely means either
      # "this push applied it" or "it was already there" -- and the second case
      # is the one that matters. A migration whose version was ALREADY recorded
      # is skipped by `db push`: the committed file never executes, and whatever
      # was actually run against production (by hand, or by `apply_migration`
      # against the live project, both of which stamp a version immediately) is
      # never compared with it. That is the only one of the three out-of-band
      # shapes that leaves every check green, and this snapshot is what makes it
      # visible. The other two are caught before merging, by migration-check.yml.
      #
      # Best-effort: if the history cannot be read the push step below will fail
      # on the same credentials and say so properly, so this does not exit 1 and
      # pre-empt a clearer error.
      #
      # /tmp/pre-push-trusted is what check (c) keys off, NOT whether the version
      # file is empty. Three states produce an empty version file and they are
      # not the same thing:
      #
      #   the read FAILED                no answer          -> do not compare
      #   the read worked, 0 recorded    an answer of none  -> DO compare
      #   the read worked, parse broke   no answer          -> do not compare
      #
      # Branching on emptiness alone treats the middle state as the other two,
      # which is the very conflation of "could not check" with "nothing to
      # check" that this workflow exists to stop making. The marker is written
      # only when the snapshot is trustworthy, INCLUDING when it is legitimately
      # empty.
      - name: Record the remote history before pushing
        run: |
          : > /tmp/pre-push-versions.txt
          rm -f /tmp/pre-push-trusted

          if supabase migration list --linked > /tmp/pre-push-list.txt 2>&1; then
            # Field 2 is the REMOTE column. Depending only on `|` as the column
            # separator is deliberate: the CLI has already changed how it
            # decorates these cells once -- it started wrapping every value in
            # backticks, which silently broke a stricter parse here and reported
            # all 237 migrations missing.
            sed -e 's/\x1b\[[0-9;]*m//g' -e 's/`//g' /tmp/pre-push-list.txt \
              | awk -F'|' 'NF>=2 { v=$2; gsub(/[^0-9]/,"",v); if (v != "") print v }' \
              | sort -u > /tmp/pre-push-versions.txt

            count="$(wc -l < /tmp/pre-push-versions.txt | tr -d ' ')"
            repo_total="$(ls supabase/migrations/*.sql 2>/dev/null | wc -l | tr -d ' ')"

            # Parsing nothing out of a repository that HAS migrations is the
            # signature of a broken parse, not of an empty database -- the same
            # reasoning as the post-push guard, which exists because the CLI
            # once started wrapping values in backticks and all 237 migrations
            # read as missing. Erring toward "not trustworthy" is deliberate:
            # trusting a broken parse makes the comparison silently vacuous,
            # which looks exactly like a clean result.
            #
            # A genuinely empty production against a non-empty repository (a
            # brand-new project) is indistinguishable from that here and would
            # draw this warning once. That is the right way round: the only cost
            # is a skipped comparison on a first-ever push, where nothing can
            # have been applied out of band anyway.
            if [ "$count" -eq 0 ] && [ "$repo_total" -gt 0 ]; then
              echo "::warning title=Could not parse the remote history before pushing::'migration list' succeeded but no versions could be read out of it, while this repository has ${repo_total} migration(s). Treating the snapshot as untrustworthy rather than as an empty history."
              cat /tmp/pre-push-list.txt
            else
              : > /tmp/pre-push-trusted
              echo "Remote history before this push: ${count} version(s)."
            fi
          else
            echo "::warning title=Could not read the remote history before pushing::The out-of-band check below cannot run. The push step should explain why."
            cat /tmp/pre-push-list.txt
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push migrations to production
        run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Prove the push actually landed, in BOTH directions, and say which of the
      # several possible problems it is.
      #
      # `db push` exiting 0 is not evidence that the repository and production
      # agree. Three distinct things can be wrong, they need different fixes,
      # and lumping them together is how the last one went unnoticed:
      #
      #   (a) a repo migration is not recorded remotely -- it did not apply.
      #   (b) a version is recorded remotely with no file in this directory --
      #       bookkeeping for something this repo cannot explain. `db push`
      #       normally refuses outright in this state ("Remote migration
      #       versions not found in local migrations directory"), blocking
      #       EVERY later migration; July 2026 lost a month to it, see
      #       docs/removed-migrations/README.md.
      #   (c) a migration this push ADDED was already recorded before the push
      #       -- so it was applied out of band and `db push` skipped the file.
      #       The schema may well be right, but nothing has compared what ran
      #       against what was committed, and nothing ever will.
      #
      # (a) and (b) are checked against the post-push history. (c) needs the
      # snapshot taken before the push, and is the reason that step exists.
      - name: Verify no migration drift
        run: |
          supabase migration list --linked > /tmp/migration-list.txt 2>&1 || {
            echo "::error title=Drift check failed::Could not read the remote migration history."
            cat /tmp/migration-list.txt
            exit 1
          }

          # Normalize before parsing. The CLI decorates this table and has
          # changed how: it now wraps every cell in backticks (`20260825170000`
          # rather than 20260825170000), which silently broke an earlier parse
          # and reported all 237 migrations missing. Splitting on `|` and
          # keeping only digits leaves this depending on the column layout
          # alone, which is the part that is actually load-bearing.
          sed -e 's/\x1b\[[0-9;]*m//g' -e 's/`//g' /tmp/migration-list.txt > /tmp/list-clean.txt
          column() {
            awk -F'|' -v col="$1" 'NF>=2 { v=$col; gsub(/[^0-9]/,"",v); if (v != "") print v }' \
              /tmp/list-clean.txt | sort -u
          }
          column 2 > /tmp/remote-versions.txt

          ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1 \
            | sort -u > /tmp/repo-versions.txt

          total="$(wc -l < /tmp/repo-versions.txt | tr -d ' ')"
          remote_total="$(wc -l < /tmp/remote-versions.txt | tr -d ' ')"

          # A parse that sees nothing remotely is far more likely to be a parse
          # that no longer matches the CLI than a production database with no
          # migrations. Say which of the two it is: a wrong diagnosis here sends
          # someone hunting a schema problem that does not exist.
          if [ "$remote_total" -eq 0 ] && [ "$total" -gt 0 ]; then
            echo "::error title=Drift check could not parse the migration list::Expected 'local | remote | time' rows and found no remote versions at all. Fix this parse rather than the schema."
            cat /tmp/migration-list.txt
            exit 1
          fi

          failed=0

          # (a) In the repo, not in production.
          comm -23 /tmp/repo-versions.txt /tmp/remote-versions.txt > /tmp/not-applied.txt
          if [ -s /tmp/not-applied.txt ]; then
            while IFS= read -r v; do
              f="$(ls supabase/migrations/${v}_*.sql 2>/dev/null | head -1)"
              echo "::error title=Migration not applied::${v} ($(basename "${f:-unknown}")) is in the repo but not in the production history."
            done < /tmp/not-applied.txt
            echo "::error::$(wc -l < /tmp/not-applied.txt | tr -d ' ') of ${total} migration(s) are missing from production. The schema does not match the merged code."
            failed=1
          fi

          # (b) In production, not in the repo.
          comm -13 /tmp/repo-versions.txt /tmp/remote-versions.txt > /tmp/orphan-versions.txt
          if [ -s /tmp/orphan-versions.txt ]; then
            while IFS= read -r v; do
              echo "::error title=Remote version has no migration file::${v} is recorded in production but no file in supabase/migrations matches it. Until this is resolved, 'supabase db push' refuses to apply ANY migration."
            done < /tmp/orphan-versions.txt
            echo "::error::Resolve each by restoring its file, or by clearing the row with 'supabase migration repair --status reverted <version>' after copying its SQL into docs/removed-migrations/."
            failed=1
          fi

          # (c) Added by this push, but already recorded before it.
          base="$GITHUB_EVENT_BEFORE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse --verify HEAD~1 2>/dev/null || true)"
          fi

          # Only the FIRST ATTEMPT of a PUSH can tell this push's migrations
          # apart from ones an earlier attempt already applied. Two paths break
          # the comparison otherwise, and both would fail a run that is fine:
          #
          #   A re-run. `db push` records each migration as it applies it, so if
          #   migration 2 of 3 fails, migration 1 stays recorded. The re-run
          #   replays the same event payload, so `before` is unchanged, but the
          #   snapshot above is taken fresh and now contains migration 1 --
          #   which this push did add. Check (c) would call it out of band.
          #   That is the recovery path README.md tells people to use, so this
          #   check would have broken the procedure this PR documents.
          #
          #   A workflow_dispatch. `github.event.before` does not exist, so
          #   `base` falls back to HEAD~1 and the diff is the last merge --
          #   every migration in which is already recorded. All of them would
          #   be reported.
          #
          # Both produce false failures, and a check that cries wolf is how the
          # real signal stops being read. Skipping is the right answer rather
          # than guessing: a genuine out-of-band apply is still caught by the
          # first-attempt push that introduces the file.
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "${GITHUB_RUN_ATTEMPT:-1}" != "1" ]; then
            echo "::notice title=Out-of-band check skipped::Only the first attempt of a push event can distinguish this push's migrations from ones an earlier attempt already applied (event=${GITHUB_EVENT_NAME}, attempt=${GITHUB_RUN_ATTEMPT:-1})."
          elif [ ! -f /tmp/pre-push-trusted ]; then
            # The MARKER, not emptiness. An empty version file can also mean a
            # production with nothing recorded yet, and that is an answer, not
            # the lack of one -- it falls through to the comparison below, which
            # correctly finds nothing out of band. The step above writes this
            # marker only when the snapshot is trustworthy.
            #
            # A WARNING, not a notice. This branch means the check WANTED to run
            # and could not, which is absence of evidence -- the one thing this
            # whole workflow exists to stop reading as evidence of absence. The
            # run still passes, because the drift check makes its own
            # `migration list` call and exits 1 if that fails, so reaching here
            # needs a transient failure that recovered. Failing the run instead
            # would turn an API blip into a red migration push, which is the
            # cry-wolf problem the first branch above is about.
            echo "::warning title=Out-of-band check COULD NOT RUN::The remote history before this push could not be read or parsed, so nothing was compared. A genuine out-of-band apply in this push would not have been detected. An empty history that READ cleanly is NOT this case -- that is compared against normally."
          elif [ -z "$base" ]; then
            echo "::warning title=Out-of-band check COULD NOT RUN::Could not resolve the commit before this push, so the set of newly added migrations is unknown and nothing was compared."
          else
            git diff --name-status --diff-filter=A --no-renames "$base" HEAD \
              -- supabase/migrations/ \
              | awk '{ print $2 }' | xargs -r -n1 basename | cut -d_ -f1 \
              | sort -u > /tmp/added-versions.txt
            comm -12 /tmp/added-versions.txt /tmp/pre-push-versions.txt > /tmp/out-of-band.txt

            if [ -s /tmp/out-of-band.txt ]; then
              while IFS= read -r v; do
                f="$(ls supabase/migrations/${v}_*.sql 2>/dev/null | head -1)"
                echo "::error title=Migration was applied out of band::${v} ($(basename "${f:-unknown}")) was added to the repo by this push, but production had already recorded it. 'db push' therefore SKIPPED the file -- what ran against production was whatever was applied by hand, which nothing has compared with the committed SQL."
              done < /tmp/out-of-band.txt
              echo "::error::Confirm production matches the file, then either accept it or re-apply properly: 'supabase migration repair --status reverted <version>' and let the next run of this workflow apply the file (which needs the file to be idempotent). See supabase/migrations/README.md."
              failed=1
            fi
          fi

          if [ "$failed" -ne 0 ]; then
            echo "--- supabase migration list --linked ---"
            cat /tmp/migration-list.txt
            exit 1
          fi

          echo "All ${total} repo migrations are recorded in production."
          echo "No remote version is unaccounted for, and nothing in this push was applied out of band."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          # Both read by check (c) to decide whether it can run at all.
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
