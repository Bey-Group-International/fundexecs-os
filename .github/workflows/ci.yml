name: CI

on:
  push:
    branches: [main]
  # Deliberately NOT scoped to `branches: [main]`. That filter matches the PR's
  # BASE, so a pull request stacked on another branch ran no tests at all — it
  # simply looked quiet rather than unverified, and #997 reached main that way.
  # Every pull request gets checked now, whatever it targets.
  #
  # The types are spelled out to add `ready_for_review`, which is NOT in the
  # default set (opened, synchronize, reopened). That omission is what turned a
  # missed delivery into an unverified merge: on #1103 the `opened` event
  # produced no run for either workflow — nothing in this file explains that, and
  # nothing here can prevent it — and because marking the PR ready is not a
  # trigger, there was no second chance. The PR sat with a quiet check panel that
  # looked passing rather than absent, and only a later push to the branch ever
  # ran the tests. #1097 had the same miss.
  #
  # This does not stop GitHub dropping an event. It means the next thing that
  # happens in practice — a draft being marked ready — asks again. The cost is
  # that a PR opened as a draft and later marked ready runs this twice; that is
  # the cheaper side of the trade against a merge nothing checked.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

  # A manual lever, for when an event is missed anyway. jest.yml has had one;
  # this workflow did not, so when #1103's runs went missing the tests could be
  # dispatched by hand and lint, typecheck and build could not.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  visual:
    name: Visual layout checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keyed on the playwright-core version, so a bump fetches the matching
      # browser and every other run restores it instead of downloading ~130MB.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright@${{ steps.pw.outputs.version }} install --with-deps chromium

      # System libraries are not in the cache, so they are installed even on a
      # cache hit. Cheap next to the browser download.
      - name: Install Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright@${{ steps.pw.outputs.version }} install-deps chromium

      # CI=true makes the suite fail rather than skip when no browser is found,
      # so a broken install can never quietly turn this job into a no-op.
      - name: Run visual checks
        run: npm run test:visual
        env:
          CI: 'true'
