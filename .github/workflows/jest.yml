name: Jest

on:
  # Run tests on PRs to verify code doesn't break before merge
  pull_request:
    # `reopened` and `ready_for_review` are both additions. Without the first, a
    # pull request closed and reopened ran no tests at all. Without the second,
    # a missed `opened` delivery had no second chance to fire — see the longer
    # note in ci.yml, which lost the same two runs on #1103.
    types: [opened, synchronize, reopened, ready_for_review]
    # No `branches:` filter on purpose — it matches the PR's BASE, so a stacked
    # pull request ran no tests. See the note in ci.yml.
    #
    # AND NO `paths:` FILTER EITHER, which is a deliberate reversal. There used
    # to be one, listing the source extensions and excluding
    # `.github/workflows/**`. It cost two things, and the second is the one that
    # matters:
    #
    #   It skipped tests on changes that can break them. `.github/workflows/**`
    #   was excluded, so a pull request touching only this file ran no tests at
    #   all -- #1235 was exactly that, and the thing it changed was a workflow
    #   that other workflows' behaviour depends on.
    #
    #   IT MADE THIS CHECK IMPOSSIBLE TO REQUIRE. A path-filtered workflow does
    #   not report a skipped check; it reports NOTHING. Branch protection reads
    #   a required check that never arrives as "expected", and the pull request
    #   can never merge -- with nothing red on the page to fix. So the check
    #   carrying 8,500 tests was the one check that could not be made to gate
    #   anything.
    #
    # The alternative is the "skip companion" pattern: a sibling workflow with
    # the inverse `paths-ignore` and a job of the same name that reports green.
    # Rejected, because getting the inverse wrong in either direction is worse
    # than the problem. Too narrow and the deadlock returns; too wide and BOTH
    # run, which puts a check named `test` that always passes beside the real
    # one -- a green stand-in able to mask a red run. That trade is not worth
    # the runner minutes it saves.
    #
    # So this runs on every pull request. On one that touches no code, jest
    # finds nothing to do and the check is honest: "tests passed" now means
    # they ran.
  # Run tests after merge and collect coverage as canonical source of truth
  push:
    # Your production branch. If not the default, update here and set Target Branch at https://gitauto.ai/dashboard/rules to match
    branches: [main]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - package.json
      - package-lock.json
  # Allow manual trigger for debugging
  workflow_dispatch:

# Cancel a superseded PR run; never cancel a run of a merged commit.
#
# A pull request groups by its number, so pushing a new commit supersedes the
# run of the old one — that is the point, and it frees a runner.
#
# Everything else groups by commit SHA. It used to fall back to `github.ref`,
# which is `refs/heads/main` for every push, so merges to main all shared one
# group and cancelled each other: of the five PRs merged within 80 seconds on
# 2026-09-07 (#1036-#1040), four had their post-merge Jest run cancelled and
# only #1040 ever ran. Those runs are the ones that publish coverage, so the
# artifact went with them. A per-commit group gives every merge its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege, stated rather than inherited. Without this block the job ran
# with the repository's DEFAULT token permissions, which can be read-write
# (zizmor: excessive-permissions). Nothing here writes: it checks out, installs,
# runs jest and uploads an artifact, and upload-artifact needs no extra scope.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep this job's token out of .git/config. checkout persists it there
          # by default, where every later step can read it (zizmor: artipacked).
          # Nothing here pushes, so it is dead weight with a blast radius.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Match your project's Node.js version
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Jest (if not present)
        run: |
          if ! npm ls jest >/dev/null 2>&1; then
            npm install --no-save jest @types/jest ts-jest
          fi

      - name: Ensure Jest config exists
        run: |
          if [ ! -f jest.config.js ] && [ ! -f jest.config.ts ] && [ ! -f jest.config.mjs ] && [ ! -f jest.config.json ]; then
            cat > jest.config.js <<'EOF'
          module.exports = {
            preset: 'ts-jest',
            testEnvironment: 'node',
            testPathIgnorePatterns: ['/node_modules/', '/.next/'],
          };
          EOF
          fi

      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx jest --passWithNoTests
          else
            npx jest --coverage --coverageReporters=lcov --passWithNoTests
          fi

      - name: Upload coverage report
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          if-no-files-found: ignore
