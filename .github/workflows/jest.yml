name: Jest

on:
  # Run tests on PRs to verify code doesn't break before merge
  pull_request:
    types: [opened, synchronize]
    # No `branches:` filter on purpose — it matches the PR's BASE, so a stacked
    # pull request ran no tests. See the note in ci.yml.
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - package.json
      - package-lock.json
      - '!.github/workflows/**'
  # Run tests after merge and collect coverage as canonical source of truth
  push:
    # Your production branch. If not the default, update here and set Target Branch at https://gitauto.ai/dashboard/rules to match
    branches: [main]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - package.json
      - package-lock.json
  # Allow manual trigger for debugging
  workflow_dispatch:

# Cancel a superseded PR run; never cancel a run of a merged commit.
#
# A pull request groups by its number, so pushing a new commit supersedes the
# run of the old one — that is the point, and it frees a runner.
#
# Everything else groups by commit SHA. It used to fall back to `github.ref`,
# which is `refs/heads/main` for every push, so merges to main all shared one
# group and cancelled each other: of the five PRs merged within 80 seconds on
# 2026-09-07 (#1036-#1040), four had their post-merge Jest run cancelled and
# only #1040 ever ran. Those runs are the ones that publish coverage, so the
# artifact went with them. A per-commit group gives every merge its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Match your project's Node.js version
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Jest (if not present)
        run: |
          if ! npm ls jest >/dev/null 2>&1; then
            npm install --no-save jest @types/jest ts-jest
          fi

      - name: Ensure Jest config exists
        run: |
          if [ ! -f jest.config.js ] && [ ! -f jest.config.ts ] && [ ! -f jest.config.mjs ] && [ ! -f jest.config.json ]; then
            cat > jest.config.js <<'EOF'
          module.exports = {
            preset: 'ts-jest',
            testEnvironment: 'node',
            testPathIgnorePatterns: ['/node_modules/', '/.next/'],
          };
          EOF
          fi

      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx jest --passWithNoTests
          else
            npx jest --coverage --coverageReporters=lcov --passWithNoTests
          fi

      - name: Upload coverage report
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          if-no-files-found: ignore
